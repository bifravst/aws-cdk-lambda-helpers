name: Test and Release

on: push

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.19.0 <25"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Authenticate with NPM registry
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Compile
        run: npx tsc

      - name: Try to build
        run: npm run prepublishOnly

      - name: Check source code with eslint
        run: npx eslint .

      - name: Check if source code is properly formatted
        run: npx prettier -c ./

      - name: Test
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          # The role is set up via https://github.com/bifravst/ci
          # secrets.AWS_ACCOUNT_ID_CI is an organization secret
          role-to-assume: |
            arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_CI }}:role/${{ github.repository_owner }}-ci-${{ github.event.repository.name }}
          # vars.AWS_REGION_CI is an organization variable
          aws-region: ${{ vars.AWS_REGION_CI }}

      - name: Generate Stack ID
        run: |
          RANDOM_STRING=`node -e "const crypto = require('crypto'); process.stdout.write(crypto.randomBytes(Math.ceil(8 * 0.5)).toString('hex').slice(0, 8));"`
          echo "STACK_NAME=lh-${RANDOM_STRING}" >> $GITHUB_ENV

      - run: npx cdk deploy --require-approval never

      - name: Upload dist folder as artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Update lambdas using the updateLambdaCode() helper
        run: |
          cp ./cdk/lambda-updated.ts ./cdk/lambda.ts
          node --no-warnings --experimental-transform-types ./cdk/update-lambdas.ts

      - name: Run end-to-end tests for the updated lambda
        run: npm run test:e2e:updated

      - run: npx cdk destroy -f

      - name: Semantic release
        continue-on-error: true
        run: npx semantic-release
