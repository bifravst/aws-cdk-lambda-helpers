name: Test and Release

on: push

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  tests-matrix:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version:
          - ">=24.22.1 <25"
          - ">=26.12.1 <27"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Compile
        run: npx tsc

      - name: Try to build
        run: npm run prepublishOnly

      - name: Check source code with eslint
        run: npx eslint .

      - name: Check if source code is properly formatted
        run: npx prettier -c ./

      - name: Test
        run: npm test

  tests:
    runs-on: ubuntu-latest

    needs: [tests-matrix]

    # Stable required status check for the repository rules, independent of
    # the Node.js versions in the matrix.
    if: ${{ always() }}

    steps:
      - name: All tests must have succeeded
        env:
          RESULT: ${{ needs.tests-matrix.result }}
        run: test "$RESULT" = "success"

  release:
    runs-on: ubuntu-24.04

    needs: [tests]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.12.1 <27"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Authenticate with NPM registry
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Try to build
        run: npm run prepublishOnly

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The role is set up via https://github.com/bifravst/ci
          # secrets.AWS_ACCOUNT_ID_CI is an organization secret
          role-to-assume: |
            arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_CI }}:role/${{ github.repository_owner }}-ci-${{ github.event.repository.name }}
          # vars.AWS_REGION_CI is an organization variable
          aws-region: ${{ vars.AWS_REGION_CI }}

      - name: Generate Stack ID
        run: |
          RANDOM_STRING=`node -e "const crypto = require('crypto'); process.stdout.write(crypto.randomBytes(Math.ceil(8 * 0.5)).toString('hex').slice(0, 8));"`
          echo "STACK_NAME=lh-${RANDOM_STRING}" >> $GITHUB_ENV

      - run: npx cdk deploy --require-approval never

      - name: Upload dist folder as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Update lambdas using the updateLambdaCode() helper
        run: |
          cp ./cdk/lambda-updated.ts ./cdk/lambda.ts
          node --no-warnings ./cdk/update-lambdas.ts

      - name: Run end-to-end tests for the updated lambda
        run: npm run test:e2e:updated

      - run: npx cdk destroy -f

      - name: Semantic release
        continue-on-error: true
        run: npx semantic-release
